name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔍 Check Environment
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🍎 Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Build iOS (Release, No Code-sign)
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q Baedal-unsigned.ipa Payload
          rm -rf Payload

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baedal-iOS-Unsigned-IPA
          path: Baedal-unsigned.ipa
          retention-days: 14
