name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Configure Flutter (Disable SPM, use CocoaPods)
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages

      - name: 🔍 Check Environment
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🍎 Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Build iOS (Release, No Code-sign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee xcode_build.log

      - name: 🔍 Display Build Errors
        if: failure()
        run: |
          echo "============================================="
          echo "         XCODE BUILD FAILURE LOGS            "
          echo "============================================="
          tail -n 120 xcode_build.log

      - name: 📄 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcode_build.log
          retention-days: 7

      - name: 📦 Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q Baedal-unsigned.ipa Payload
          rm -rf Payload

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baedal-iOS-Unsigned-IPA
          path: Baedal-unsigned.ipa
          retention-days: 14
