name: Build & Release iOS App to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-release-ios:
    name: Build & Publish iOS App
    runs-on: macos-15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚙️ Configure Flutter (Disable SPM, use CocoaPods)
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages

      - name: 🔍 Check Environment
        run: |
          flutter --version
          xcodebuild -version
          pod --version
          fastlane --version

      - name: 🔐 Install Apple Distribution Certificate into Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "=== Checking Certificate Secrets ==="
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "❌ ERROR: Secret 'BUILD_CERTIFICATE_BASE64' is missing or empty!"
            echo "Please ensure you added BUILD_CERTIFICATE_BASE64 in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "$P12_PASSWORD" ]; then
            echo "❌ ERROR: Secret 'P12_PASSWORD' is missing or empty!"
            echo "Please ensure you added P12_PASSWORD in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Secret BUILD_CERTIFICATE_BASE64 length: ${#BUILD_CERTIFICATE_BASE64} chars."

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Apple Worldwide Developer Relations intermediate certificate
          curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/AppleWWDRCAG3.cer
          security import /tmp/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign

          # Decode p12 using Node.js to strip any copy-paste whitespace
          node -e "
            const fs = require('fs');
            const raw = (process.env.BUILD_CERTIFICATE_BASE64 || '').replace(/\s+/g, '');
            const buf = Buffer.from(raw, 'base64');
            fs.writeFileSync('/tmp/certificate.p12', buf);
            console.log('Decoded certificate size:', buf.length, 'bytes');
          "

          # Convert p12 to legacy format for macOS Keychain compatibility (handles OpenSSL 3 PBKDF2/AES-256)
          openssl pkcs12 -in /tmp/certificate.p12 -passin pass:"$P12_PASSWORD" -nodes -out /tmp/cert_combined.pem || true
          if [ -f /tmp/cert_combined.pem ]; then
            openssl pkcs12 -export -in /tmp/cert_combined.pem -inkey /tmp/cert_combined.pem -out /tmp/legacy_cert.p12 -passout pass:"$P12_PASSWORD" -legacy || true
          fi

          if [ -f /tmp/legacy_cert.p12 ]; then
            echo "Importing legacy-compatible certificate into keychain..."
            security import /tmp/legacy_cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH || security import /tmp/legacy_cert.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A
          else
            echo "Importing certificate into keychain..."
            security import /tmp/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH || security import /tmp/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A
          fi

          # Allow codesign tool to access keychain without prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

          # Set as default keychain in search list
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/"//g')

          echo "=== Installed Signing Identities ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH || true

      - name: 📲 Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Installing provisioning profile from secret..."
            node -e "
              const fs = require('fs');
              const path = require('path');
              const os = require('os');
              const raw = (process.env.BUILD_PROVISION_PROFILE_BASE64 || '').replace(/\s+/g, '');
              const buf = Buffer.from(raw, 'base64');
              const dir = path.join(os.homedir(), 'Library', 'MobileDevice', 'Provisioning Profiles');
              fs.writeFileSync(path.join(dir, '79e81f4f-1bab-4e7f-a10f-d565c2f3cbd9.mobileprovision'), buf);
              fs.writeFileSync(path.join(dir, 'Baedal AppStore Profile 2026.mobileprovision'), buf);
              console.log('Provisioning profile written successfully!');
            "
          elif [ -n "$APP_STORE_PRIVATE_KEY" ]; then
            echo "Fetching active provisioning profile via App Store Connect API..."
            node scripts/download_profile.js
          else
            echo "❌ No provisioning profile secret or App Store API Key provided."
            exit 1
          fi
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🍎 Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Build iOS IPA (Release, Code-signed)
        run: |
          set -o pipefail
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist 2>&1 | tee xcode_build.log

      - name: 🔍 Display Build Errors
        if: failure()
        run: |
          if [ -f xcode_build.log ]; then
            echo "============================================="
            echo "         XCODE BUILD FAILURE LOGS            "
            echo "============================================="
            tail -n 120 xcode_build.log
          else
            echo "No xcode_build.log found (build step did not start)."
          fi

      - name: 📄 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcode_build.log
          retention-days: 7

      - name: 🚀 Upload IPA Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Baedal-iOS-Release-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: 🚀 Publish to Apple TestFlight / App Store Connect
        if: success()
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          # Sanitize environment variables (strip carriage returns, newlines, spaces, and accidental prefixes/suffixes)
          APP_STORE_KEY_ID=$(echo "$APP_STORE_KEY_ID" | tr -d '\r\n ' | sed -e 's/^AuthKey_//' -e 's/\.p8$//')
          APP_STORE_ISSUER_ID=$(echo "$APP_STORE_ISSUER_ID" | tr -d '\r\n ')
          export APP_STORE_KEY_ID
          export APP_STORE_ISSUER_ID

          if [ -z "$APP_STORE_PRIVATE_KEY" ] || [ -z "$APP_STORE_KEY_ID" ] || [ -z "$APP_STORE_ISSUER_ID" ]; then
            echo "❌ App Store Connect credentials missing, skipping upload."
            exit 1
          fi

          echo "Using App Store Key ID: $APP_STORE_KEY_ID"
          echo "Using App Store Issuer ID: $APP_STORE_ISSUER_ID"

          # Setup Apple API private key in standard directories expected by Apple tools
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ALT_KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR" "$ALT_KEY_DIR"
          export API_PRIVATE_KEYS_DIR="$KEY_DIR"

          KEY_FILE="$KEY_DIR/AuthKey_${APP_STORE_KEY_ID}.p8"
          ALT_KEY_FILE="$ALT_KEY_DIR/AuthKey_${APP_STORE_KEY_ID}.p8"

          node -e "
            const fs = require('fs');
            let key = (process.env.APP_STORE_PRIVATE_KEY || '').trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            if (!key.endsWith('\n')) key += '\n';

            ['$KEY_FILE', '$ALT_KEY_FILE'].forEach(target => {
              fs.writeFileSync(target, key, { mode: 0o600 });
              console.log('Saved Apple API Key to:', target, 'Size:', fs.statSync(target).size);
            });
          "
          chmod 600 "$KEY_FILE" "$ALT_KEY_FILE" || true

          # Find release IPA as an absolute path
          IPA_PATH=$(find "$GITHUB_WORKSPACE/build/ios/ipa" -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "❌ No .ipa file found in build/ios/ipa/"
            ls -la build/ios/ || true
            exit 1
          fi

          echo "Found signed IPA for upload: $IPA_PATH ($(ls -lh "$IPA_PATH" | awk '{print $5}'))"

          echo "============================================="
          echo "  UPLOADING TO TESTFLIGHT VIA XCRUN ALTOOL   "
          echo "============================================="
          if xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID" --show-progress; then
            echo "🎉 Successfully uploaded IPA to App Store Connect / TestFlight!"
          else
            echo "⚠️ altool reported an issue, trying Fastlane pilot fallback..."
            cd "$GITHUB_WORKSPACE/ios"
            fastlane upload_to_testflight key_file:"$KEY_FILE" ipa:"$IPA_PATH"
            cd "$GITHUB_WORKSPACE"
          fi

      - name: 🧹 Clean up keychain & temporary credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys" /tmp/*.p8 /tmp/*.pem /tmp/*.p12 || true
