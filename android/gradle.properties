org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
android.r8.proguardAndroidTxt.disallowed=false

# Disable Kotlin incremental compilation to avoid Windows cross-drive (C: vs J:) bug
kotlin.incremental=false
kapt.incremental.apt=false

# Limit worker concurrency to prevent AAPT2 daemons from exhausting system memory
org.gradle.workers.max=4